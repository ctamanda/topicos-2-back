# =====================================================================
# FinControl - application.properties
# Perfis: (padrao = prod) | %dev = quarkus:dev | %test = ./mvnw test
# =====================================================================

# --- Banco de dados (PostgreSQL) -------------------------------------
# Os valores depois de ":" sao os padroes locais; em producao vem de variaveis de ambiente.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fincontroldb}
quarkus.datasource.username=${DATABASE_USER:fincontrol}
quarkus.datasource.password=${DATABASE_PASSWORD:123456}

# Docker devservices desligado (banco local ou docker compose)
quarkus.devservices.enabled=false

# --- Schema: quem cria/altera tabela e o Flyway; o Hibernate so valida --
# Migrations em src/main/resources/db/migration (V1__, V2__, ...).
# Migration que ja foi para a main NUNCA e editada: cria-se outra por cima.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=validate
quarkus.jackson.write-dates-as-timestamps=false

# --- Servidor / CORS -------------------------------------------------
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition, X-Page, X-Page-Size, X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# --- JWT (SmallRye) --------------------------------------------------
# Chaves em src/main/resources (classpath). NUNCA em META-INF/resources,
# que o Quarkus serve como conteudo estatico publico.
# As variaveis *_LOCATION permitem apontar para arquivo externo (ex.: secret file no deploy).
mp.jwt.verify.issuer=fincontrol
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}

# --- Erros RFC 7807: base do campo "type" ----------------------------
problem.base-url=${PROBLEM_BASE_URL:https://api.fincontrol.com}
%dev.problem.base-url=http://localhost:8080
%test.problem.base-url=http://localhost:8081

# --- Scheduler (recorrencias) ----------------------------------------
quarkus.scheduler.enabled=true

# --- Logs (somente dev) ----------------------------------------------
# bind-parameters imprime valores reais (e-mail, hash de senha): nunca fora do dev.
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true
%dev.quarkus.log.console.enable=true
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."br.unitins.tp2.fincontrol".level=DEBUG

# --- Testes: H2 em memoria, sem depender de Docker/PostgreSQL --------
# Flyway desligado; o schema vem das entidades (drop-and-create).
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:fincontrol_test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
