# Configuracao do banco de dados
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = fincontrol
quarkus.datasource.password = 123456
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/fincontroldb

quarkus.hibernate-orm.database.generation=drop-and-create

# Desabilitar docker devservices
quarkus.devservices.enabled=false

# Logging SQL
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# Configuracao CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition, X-Page, X-Page-Size, X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Configuracao JWT
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=fincontrol-jwt
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Base URL para exception handling
%dev.problem.base-url=http://localhost:8080
%prod.problem.base-url=https://api.fincontrol.com

# Quarkus Scheduler
quarkus.scheduler.enabled=true

# Logging detalhado no perfil dev
%dev.quarkus.log.console.enable=true
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."br.unitins.tp2.fincontrol".level=DEBUG